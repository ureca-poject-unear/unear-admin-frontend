<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선착순 쿠폰 생성</title>
    <link rel="stylesheet" href="../css/event_coupon.css">
</head>
<body>
    <div class="header">
        <div class="header-left">
            <button class="back-btn" onclick="goBack()">←</button>
            <div class="header-title">
                <h1>이벤트 선착순 쿠폰 생성</h1>
                <div class="header-subtitle">팝업스토어 전용 선착순 쿠폰을 만들어보세요</div>
            </div>
        </div>
        <div class="event-info">
            <div class="event-icon">🎉</div>
            <span id="eventName">이벤트 #1234</span>
        </div>
    </div>

    <div class="main-container">
        <div class="form-card">
            <div class="card-title">
                <div class="card-icon">🎫</div>
                쿠폰 정보 입력
            </div>
            <div class="card-subtitle">팝업스토어에서 사용 가능한 선착순 쿠폰 정보를 입력해주세요</div>

            <div id="errorMessage" class="error-message" style="display: none;"></div>
            <div id="successMessage" class="success-message" style="display: none;"></div>

            <form id="couponForm" class="form-grid">
                <div class="form-group">
                    <label class="form-label">
                        쿠폰명 <span class="required">*</span>
                    </label>
                    <input type="text" id="couponName" class="form-input" placeholder="예: 팝업스토어 오픈 기념 할인 쿠폰" required maxlength="50">
                    <div class="input-hint">최대 50자까지 입력 가능합니다</div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">
                            발급 수량 <span class="required">*</span>
                        </label>
                        <div class="quantity-input">
                            <input type="number" id="remainingQuantity" class="form-input" min="1" max="10000" value="100" required>
                            <div class="quantity-buttons">
                                <button type="button" class="quantity-btn" onclick="adjustQuantity(1)">+</button>
                                <button type="button" class="quantity-btn" onclick="adjustQuantity(-1)">-</button>
                            </div>
                        </div>
                        <div class="input-hint">1 ~ 10,000개</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            할인 정책 <span class="required">*</span>
                        </label>
                        <select id="discountPolicyId" class="form-select" required>
                            <option value="">할인 정책을 선택하세요</option>
                            <option value="1">음료 10% 할인</option>
                            <option value="2">푸드 15% 할인</option>
                            <option value="3">전 상품 20% 할인</option>
                            <option value="4">3,000원 할인</option>
                            <option value="5">5,000원 할인</option>
                            <option value="6">10,000원 할인</option>
                            <option value="7">무료 음료 쿠폰</option>
                            <option value="8">무료 디저트 쿠폰</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">
                            사용 시작일 <span class="required">*</span>
                        </label>
                        <input type="date" id="couponStart" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            사용 종료일 <span class="required">*</span>
                        </label>
                        <input type="date" id="couponEnd" class="form-input" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">팝업스토어 위치</label>
                        <input type="text" id="popupLocation" class="form-input" placeholder="예: 강남역 2번 출구 앞" readonly>
                        <div class="input-hint">현재 이벤트의 팝업스토어에서만 사용 가능</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">회원 등급 제한</label>
                        <select id="membershipCode" class="form-select">
                            <option value="">전체</option>
                            <option value="BRONZE">브론즈</option>
                            <option value="SILVER">실버</option>
                            <option value="GOLD">골드</option>
                            <option value="PLATINUM">플래티넘</option>
                        </select>
                    </div>
                </div>

                <div class="action-buttons">
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">
                        🔄 초기화
                    </button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <span id="submitText">🎫 쿠폰 생성</span>
                        <div id="submitSpinner" class="spinner" style="display: none;"></div>
                    </button>
                </div>
            </form>
        </div>

        <div class="preview-card">
            <div class="card-title">
                <div class="card-icon">👁️</div>
                쿠폰 미리보기
            </div>
            <div class="card-subtitle">생성될 쿠폰의 모습을 미리 확인해보세요</div>

            <div class="preview-stats">
                <div class="stat-item">
                    <div class="stat-number" id="previewQuantity">100</div>
                    <div class="stat-label">발급 예정</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="previewDays">0</div>
                    <div class="stat-label">사용 가능 일수</div>
                </div>
            </div>

            <div class="coupon-preview">
                <div class="coupon-header">
                    <div class="coupon-badge">선착순</div>
                    <div class="coupon-badge">FCFS</div>
                </div>
                <div class="coupon-name" id="previewName">쿠폰명을 입력해주세요</div>
                <div class="coupon-details">
                    <div class="coupon-detail">
                        <span>할인:</span>
                        <span id="previewDiscount">-</span>
                    </div>
                    <div class="coupon-detail">
                        <span>수량:</span>
                        <span id="previewQuantityText">100개</span>
                    </div>
                    <div class="coupon-detail">
                        <span>장소:</span>
                        <span id="previewPlace">팝업스토어 전용</span>
                    </div>
                    <div class="coupon-detail">
                        <span>등급:</span>
                        <span id="previewGrade">전체</span>
                    </div>
                </div>
            </div>

            <div style="text-align: center; color: #666; font-size: 12px;">
                📱 실제 사용자에게는 QR코드가 함께 표시됩니다
            </div>
        </div>
    </div>
<script src="../js/event_coupon.js"></script>
</body>
</html>
