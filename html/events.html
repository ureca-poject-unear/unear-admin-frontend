<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>이벤트 등록</title>
  <link rel="stylesheet" href="../css/events.css" />
</head>
<body>
  <div class="container">
    <h1>이벤트 등록</h1>

    <form id="eventForm">
      <div class="form-group">
        <label for="eventName">이벤트 이름</label>
        <input type="text" id="eventName" name="eventName" placeholder="이벤트 이름을 입력하세요" required />
      </div>

      <div class="form-group">
        <label for="description">이벤트 설명</label>
        <textarea id="description" name="description" rows="4" placeholder="이벤트 설명을 입력하세요" required></textarea>
      </div>

      <div class="form-group">
        <label for="latitude">위도</label>
        <input type="number" id="latitude" name="latitude" step="any" placeholder="37.5665" required />
      </div>

      <div class="form-group">
        <label for="longitude">경도</label>
        <input type="number" id="longitude" name="longitude" step="any" placeholder="126.9780" required />
      </div>

      <div class="form-group">
        <label for="radius">반경 (m)</label>
        <input type="number" id="radius" name="radius" placeholder="예: 1000" required />
      </div>

      <div class="form-group">
        <label for="startDate">시작일</label>
        <input type="date" id="startDate" name="startDate" required />
      </div>

      <div class="form-group">
        <label for="endDate">종료일</label>
        <input type="date" id="endDate" name="endDate" required />
      </div>

      <button type="submit" class="submit-btn">다음 단계로 →</button>
    </form>
  </div>

  <script src="../js/events.js"></script>
</body>
</html>
