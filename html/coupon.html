<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쿠폰 관리 시스템</title>
    <link rel="stylesheet" href="../css/coupon.css">
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="logo">🎫</div>
                <div class="header-title">
                    <h1>쿠폰 관리 시스템</h1>
                    <div class="header-subtitle">할인 쿠폰을 효율적으로 관리하세요</div>
                </div>
            </div>
            <div class="user-info">
                <div class="user-avatar">A</div>
                <span>관리자</span>
            </div>
        </div>

        <!-- Controls Section -->
        <div class="controls-section">
            <div class="controls-header">
                <h2 class="controls-title">
                    <span>📋</span>
                    쿠폰 관리
                </h2>
                <button class="add-btn" onclick="openModal('create')">
                    <span>➕</span>
                    새 쿠폰 추가
                </button>
            </div>
            
            <div class="search-filters">
                <div class="filter-group">
                    <label>쿠폰명 검색</label>
                    <input type="text" id="searchInput" placeholder="쿠폰명을 입력하세요..." onkeyup="filterCoupons()">
                </div>
                <div class="filter-group">
                    <label>할인 정책</label>
                    <select id="policyFilter" onchange="filterCoupons()">
                        <option value="">전체</option>
                        <option value="COUPON_FIXED">금액 할인</option>
                        <option value="COUPON_PERCENT">퍼센트 할인</option>
                        <option value="COUPON_FCFS">선착순 쿠폰</option>
                    </select>
                </div>
                <button class="refresh-btn" onclick="loadCoupons()">🔄</button>
            </div>
        </div>

        <!-- Coupons Container -->
        <div class="coupons-container">
            <div class="coupons-list" id="couponsList">
                <!-- Loading indicator -->
                <div class="loading" id="loadingIndicator">
                    <div class="spinner"></div>
                    <div>쿠폰 정보를 불러오는 중...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="couponModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">새 쿠폰 추가</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            
            <form id="couponForm">
                <div class="form-group">
                    <label>쿠폰명</label>
                    <input type="text" id="couponName" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>할인 정책</label>
                        <select id="discountCode" required>
                            <option value="">선택하세요</option>
                            <option value="COUPON_FIXED">금액 할인</option>
                            <option value="COUPON_PERCENT">퍼센트 할인</option>
                            <option value="COUPON_FCFS">선착순 쿠폰</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>잔여 수량</label>
                        <input type="number" id="remainingQuantity" placeholder="-1 = 무제한">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>시작일</label>
                        <input type="date" id="couponStart" required>
                    </div>
                    <div class="form-group">
                        <label>종료일</label>
                        <input type="date" id="couponEnd" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>할인 정책 ID</label>
                    <input type="number" id="discountPolicyId" required>
                </div>
            </form>
            
            <div class="modal-actions">
                <button class="modal-btn btn-secondary" onclick="closeModal()">취소</button>
                <button class="modal-btn btn-primary" onclick="saveCoupon()">저장</button>
            </div>
        </div>
    </div>
    <script src="../js/coupon.js"></script>
</body>
</html>
