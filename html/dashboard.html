<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>요약 대시보드</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/main.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .main-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: space-between;
        }
        .main-grid.three-column .dashboard-card {
            flex: 1 1 calc(33.333% - 24px);
            max-width: calc(33.333% - 24px);
        }
        .main-grid.two-column .dashboard-card {
            flex: 1 1 calc(50% - 24px);
            max-width: calc(50% - 24px);
        }
        .dashboard-card {
            min-width: 300px;
            padding: 16px;
            border-radius: 16px;
            background-color: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            height: 680px;
            display: flex;
            flex-direction: column;
        }
        .card-title { font-size: 20px; margin-bottom: 4px; }
        .chart-wrapper { height: 600px; }

        #filter-form {
            display: flex;
            gap: 16px;
            align-items: flex-end;
        }

        /* 버튼 그룹 정렬 */
        .dashboard-toggle {
            display: flex;
            gap: 12px;
            height: 40px;
            align-items: flex-end;  /* ✅ 버튼 하단 정렬로 맞춤 */
        }


        /* 통합 wrapper */
        .filter-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-end;  /* ✅ 여기 핵심: 하단 정렬로 통일 */
            gap: 32px;
            flex-wrap: wrap;
            margin: 24px 0;
        }

        /* 버튼 높이 통일 */
        .submit-button {
            padding: 9px 20px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            height: 40px;  /* 모든 버튼 높이 통일 */
            box-sizing: border-box;
        }

        /* toggle 버튼 스타일 */
        .dashboard-toggle .submit-button {
            background-color: #d0d8ff; /* 더 진한 연보라 */
            color: #3f51b5;            /* 가독성 좋은 남색 계열 */
            font-weight: 500;
        }


        .dashboard-toggle .submit-button.active {
            background-color: #4C6EF5;
            color: white;
            font-weight: bold;
            border: 2px solid #4C6EF5;
        }



        .form-group {
            min-width: 120px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* 하단 정렬 */
        }
        .form-group select,
        .form-group input[type="month"] {
            padding: 8px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #ccc;
            height: 40px;
        }

        .submit-button:hover {
            background-color: #7e9dfc; /* 연한 블루톤 */
        }
        body { overflow-x: hidden; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-left"><h1>UNEAR ADMIN</h1><div class="welcome-message">환영합니다, 관리자님!</div></div>
        <div class="header-right"><div class="user-info"><div class="user-avatar">관</div><span>관리자</span></div>
            <button class="logout-btn" onclick="handleLogout()">로그아웃</button></div>
    </div>

    <!-- 기존 form + dashboard-toggle 분리 → 하나의 filter-wrapper로 통합 -->
    <div class="filter-wrapper">
        <div class="dashboard-toggle">
            <button onclick="showSection('summary')" class="submit-button">사용자 행동 통계</button>
            <button onclick="showSection('event')" class="submit-button">이벤트 통계</button>
        </div>
        <form id="filter-form" class="filter-form">
            <div class="form-group">
                <select id="ageGroup">
                    <option value="">연령대</option>
                    <option value="10s">10대</option>
                    <option value="20s">20대</option>
                    <option value="30s">30대</option>
                    <option value="40s">40대</option>
                </select>
            </div>
            <div class="form-group">
                <select id="gender">
                    <option value="">성별</option>
                    <option value="M">남성</option>
                    <option value="F">여성</option>
                </select>
            </div>
            <div class="form-group">
                <input type="month" id="yearMonth" placeholder="월 선택" />
            </div>
            <div class="form-group">
                <label>&nbsp;</label>
                <button type="submit" class="submit-button">조회</button>
            </div>
        </form>
    </div>

    <div id="summary-section" class="main-grid three-column">
        <div class="card dashboard-card">
            <div class="card-title">인기 검색어</div>
            <div class="chart-wrapper"><canvas id="chartKeyword"></canvas></div>
        </div>
        <div class="card dashboard-card">
            <div class="card-title">관심 카테고리</div>
            <div class="chart-wrapper"><canvas id="chartCategory"></canvas></div>
        </div>
        <div class="card dashboard-card">
            <div class="card-title">시간대별 활성도</div>
            <div class="chart-wrapper"><canvas id="chartActivate"></canvas></div>
        </div>
    </div>

    <div id="event-section" class="main-grid two-column" style="display:none;">
        <div class="card dashboard-card">
            <div class="card-title">인기 이벤트 매장 순위</div>
            <div class="chart-wrapper"><canvas id="eventChart"></canvas></div>
        </div>
        <div class="card dashboard-card">
            <div class="card-title">이벤트 참여 통계</div>
            <div class="chart-wrapper"><canvas id="completionChart"></canvas></div>
        </div>
    </div>
</div>

<script>
    const BASE_URL = "https://dev.unear.site/api";
    const form = document.getElementById('filter-form');
    const chartInstances = {};
    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('yearMonth').value = new Date().toISOString().slice(0, 7);
        form.dispatchEvent(new Event('submit'));
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const ageGroup = document.getElementById('ageGroup').value;
        const gender = document.getElementById('gender').value;
        const yearMonth = document.getElementById('yearMonth').value;

        // 현재 보여지는 섹션 파악
        const isSummaryVisible = document.getElementById('summary-section').style.display !== 'none';
        const isEventVisible = document.getElementById('event-section').style.display !== 'none';

        // 🔹 요약 대시보드인 경우: 3개 타입 반복 조회
        if (isSummaryVisible) {
            const types = ['keyword', 'category', 'activate'];
            for (const type of types) {
                const params = new URLSearchParams({ type, yearMonth });
                if (ageGroup) params.append('ageGroup', ageGroup);
                if (gender) params.append('gender', gender);

                const res = await fetch(`${BASE_URL}/admin/admin/summary?${params.toString()}`);
                const result = await res.json();
                renderSummary(type, result, `chart${capitalize(type)}`, type === 'activate' ? 'line' : 'bar');
            }
        }

        // 🔹 이벤트 통계인 경우: 통계 API 호출
        if (isEventVisible) {
            await loadEventStats();  // ← 여기서 이벤트 통계 차트와 테이블 업데이트
        }
    });


    function renderSummary(type, data, canvasId, chartType) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        if (chartInstances[canvasId]) chartInstances[canvasId].destroy();

        const categoryLabelMap = {
            life: '생활',
            culture: '문화',
            cafe: '카페',
            food: '음식',
            education: '교육',
            bakery: '베이커리',
            shopping: '쇼핑',
            activity: '액티비티',
            beauty: '뷰티'
        };

        let datasetLabel = '';
        switch (type) {
            case 'category':
                datasetLabel = '카테고리';
                break;
            case 'keyword':
                datasetLabel = '검색량';
                break;
            case 'activate':
                datasetLabel = '활성도';
                break;
            default:
                datasetLabel = `${type} 수`;
        }

        let labels, counts;
        if (type === 'activate') {
            const sorted = data.filter(d => d.keyword >= 6 && d.keyword <= 23).sort((a, b) => a.keyword - b.keyword);
            labels = sorted.map(d => `${d.keyword}시`);
            counts = sorted.map(d => d.count);
        } else {
            const top10 = data.sort((a, b) => b.count - a.count).slice(0, 10);
            labels = top10.map(d =>
                type === 'category' ? (categoryLabelMap[d.keyword] || d.keyword) : d.keyword
            );
            counts = top10.map(d => d.count);
        }

        chartInstances[canvasId] = new Chart(ctx, {
            type: chartType,
            data: {
                labels: labels,
                datasets: [{
                    label: datasetLabel,
                    data: counts,
                    backgroundColor: 'rgba(102, 126, 234, 0.6)',
                    borderColor: 'rgba(102, 126, 234, 1)',
                    borderWidth: 1,
                    fill: chartType !== 'line',
                    tension: 0.4,
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: true }
                },
                scales: {
                    x: {
                        ticks: {
                            autoSkip: false,
                            maxRotation: 0,
                            minRotation: 0,
                            padding: 8,
                            color: '#333',
                            font: { size: 12, weight: '500' }
                        }
                    },
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }


    function showSection(section) {
        const summary = document.getElementById('summary-section');
        const event = document.getElementById('event-section');

        if (section === 'summary') {
            summary.style.display = 'flex';
            summary.classList.add('three-column');
            event.style.display = 'none';
            event.classList.remove('two-column');
        } else {
            summary.style.display = 'none';
            summary.classList.remove('three-column');
            event.style.display = 'flex';
            event.classList.add('two-column');
            loadEventStats();
        }
        document.querySelectorAll('.dashboard-toggle .submit-button').forEach(btn => {
            btn.classList.remove('active');
        });
        const activeBtn = document.querySelector(`.dashboard-toggle .submit-button[onclick="showSection('${section}')"]`);
        if (activeBtn) activeBtn.classList.add('active');

    }


    async function loadEventStats() {
        // 🔹 1. 필터 값 받기
        const ageGroup = document.getElementById('ageGroup').value;
        const gender = document.getElementById('gender').value;
        const dynamicMonth = document.getElementById('yearMonth').value;
        const fixedMonth = '2025-08';  // 🔒 고정된 월 (인기 이벤트 매장용)

        // 🔹 2. 인기 이벤트 매장 순위 (항상 8월)
        const res1 = await fetch(`${BASE_URL}/admin/admin/summary/event-place?yearMonth=${fixedMonth}`);
        const data1 = await res1.json();
        const sorted = data1.sort((a, b) => b.count - a.count).slice(0, 15);
        const labels = sorted.map(d => d.keyword);
        const counts = sorted.map(d => d.count);
        const ctx1 = document.getElementById('eventChart').getContext('2d');
        if (chartInstances['eventChart']) chartInstances['eventChart'].destroy();
        chartInstances['eventChart'] = new Chart(ctx1, {
            type: 'bar',
            data: {
                labels,
                datasets: [{
                    label: '관심도',
                    data: counts,
                    backgroundColor: 'rgba(255,99,132,0.6)'
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: {
                        beginAtZero: true,
                        ticks: {
                            color: '#333',
                            font: { size: 12, weight: '500' }
                        }
                    },
                    y: {
                        ticks: {
                            color: '#333',
                            font: { size: 12, weight: '500' }
                        }
                    }
                }
            }
        });


        // 🔹 3. 완료율/이탈율 통계 (필터 반영)
        const params = new URLSearchParams({ yearMonth: dynamicMonth });
        if (ageGroup) params.append('ageGroup', ageGroup);
        if (gender) params.append('gender', gender);

        const res2 = await fetch(`${BASE_URL}/admin/admin/summary/event-stats?${params}`);
        const data2 = await res2.json();
        const group = data2[0] || {};
        const totalJoin = group.joinCount || 0;
        const totalDone = group.doneCount || 0;
        const totalDrop = group.dropCount || 0;
        const doneRate = +(group.completionRate * 100 || 0).toFixed(1);
        const dropRate = +(group.dropRate * 100 || 0).toFixed(1);

        const ctx2 = document.getElementById('completionChart').getContext('2d');
        if (chartInstances['completionChart']) chartInstances['completionChart'].destroy();
        chartInstances['completionChart'] = new Chart(ctx2, {
            type: 'bar',
            data: {
                labels: ["참여자 수", "완료자 수", "이탈자 수", "완료율 (%)", "이탈율 (%)"],
                datasets: [
                    {
                        label: '인원 수',
                        data: [totalJoin, totalDone, totalDrop, null, null],
                        backgroundColor: ['#36A2EB', '#4BC0C0', '#FF6384', 'transparent', 'transparent'],
                        yAxisID: 'y',
                    },
                    {
                        label: '비율 (%)',
                        data: [null, null, null, doneRate, dropRate],
                        backgroundColor: ['transparent', 'transparent', 'transparent', '#9966FF', '#FF9F40'],
                        yAxisID: 'y1',
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        ticks: {
                            maxRotation: 0,
                            minRotation: 0,
                            color: '#333',
                            font: { size: 12, weight: '500' }
                        }
                    },
                    y: {
                        beginAtZero: true,
                        title: { display: true, text: '인원 수' },
                        ticks: {
                            color: '#333',
                            font: { size: 12, weight: '500' }
                        }
                    },
                    y1: {
                        beginAtZero: true,
                        position: 'right',
                        title: { display: true, text: '비율 (%)' },
                        ticks: {
                            callback: value => `${value}%`,
                            color: '#666',
                            font: { size: 12, weight: '500' }
                        },
                        grid: {
                            drawOnChartArea: false
                        }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });
        // 🔹 4. 테이블 갱신
        document.getElementById('statsTableBody').innerHTML = data2.map(d => `
        <tr>
            <td>${d.group || '전체'}</td>
            <td>${d.joinCount}</td>
            <td>${d.doneCount}</td>
            <td>${d.dropCount}</td>
            <td>${(d.completionRate * 100).toFixed(1)}%</td>
            <td>${(d.dropRate * 100).toFixed(1)}%</td>
        </tr>
    `).join('');
    }
    // 로그아웃 함수 정의
    async function handleLogout() {
        try {
            const res = await fetch('https://dev.unear.site/api/admin/auth/logout', {
                method: 'POST',
                credentials: 'include' // 세션/쿠키 포함
            });

            if (res.ok) {
                alert('로그아웃 되었습니다.');
                // 필요시 localStorage/sessionStorage 초기화
                localStorage.clear();
                sessionStorage.clear();

                window.location.href = '/index.html'; // 로그인 화면으로 리다이렉트
            } else {
                alert('로그아웃 실패');
            }
        } catch (error) {
            console.error('로그아웃 에러:', error);
            alert('에러 발생. 다시 시도해주세요.');
        }
    }



    function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }
    window.addEventListener('DOMContentLoaded', () => {
        showSection('summary');
    });
</script>
</body>
</html>
