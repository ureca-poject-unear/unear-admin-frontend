<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>요약 대시보드</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/main.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        .main-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
        }

        .dashboard-card {
            flex: 1 1 calc(33% - 20px);
            min-width: 320px;
            min-height: 550px;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            background-color: white;
        }

        .chart-wrapper {
            height: 350px;
            margin-bottom: 20px;
        }

        @media (max-width: 1200px) {
            .dashboard-card {
                flex: 1 1 100%;
            }
        }

        body {
            overflow-x: hidden;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-left">
            <h1>UNEAR ADMIN</h1>
            <div class="welcome-message">환영합니다, 관리자님!</div>
        </div>
        <div class="header-right">
            <div class="user-info">
                <div class="user-avatar">관</div>
                <span>관리자1</span>
            </div>
            <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        </div>
    </div>

    <form id="filter-form" style="display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 25px;">
        <label>연령대:
            <select id="ageGroup">
                <option value="">전체</option>
                <option value="10s">10대</option>
                <option value="20s">20대</option>
                <option value="30s">30대</option>
                <option value="40s">40대</option>
            </select>
        </label>

        <label>성별:
            <select id="gender">
                <option value="">전체</option>
                <option value="M">남성</option>
                <option value="F">여성</option>
            </select>
        </label>

        <label>월 선택:
            <input type="month" id="yearMonth" required />
        </label>

        <button type="submit" class="card-action" style="height: fit-content;">조회</button>
    </form>

    <div class="main-grid">
        <!-- 인기 검색어 -->
        <div class="card dashboard-card">
            <div class="card-icon">🔍</div>
            <div class="card-title">인기 검색어</div>
            <div class="card-description">최근 인기 키워드를 확인하세요</div>
            <div class="chart-wrapper">
                <canvas id="chartKeyword"></canvas>
            </div>
            <table>
                <thead><tr><th>항목</th><th>카운트</th><th>유니크 유저 수</th></tr></thead>
                <tbody id="tableKeyword"></tbody>
            </table>
        </div>

        <!-- 관심 카테고리 -->
        <div class="card dashboard-card">
            <div class="card-icon">📂</div>
            <div class="card-title">관심 카테고리</div>
            <div class="card-description">사용자의 관심 카테고리를 분석합니다</div>
            <div class="chart-wrapper">
                <canvas id="chartCategory"></canvas>
            </div>
            <table>
                <thead><tr><th>항목</th><th>카운트</th><th>유니크 유저 수</th></tr></thead>
                <tbody id="tableCategory"></tbody>
            </table>
        </div>

        <!-- 시간대별 활성도 -->
        <div class="card dashboard-card">
            <div class="card-icon">⏰</div>
            <div class="card-title">시간대별 활성도</div>
            <div class="card-description">어느 시간대에 활동이 가장 많은지 확인하세요</div>
            <div class="chart-wrapper">
                <canvas id="chartActivate"></canvas>
            </div>
            <table>
                <thead><tr><th>시간</th><th>카운트</th><th>유니크 유저 수</th></tr></thead>
                <tbody id="tableActivate"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const BASE_URL = "https://dev.unear.site/api";
    const form = document.getElementById('filter-form');
    const chartInstances = {};

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const ageGroup = document.getElementById('ageGroup').value;
        const gender = document.getElementById('gender').value;
        const yearMonth = document.getElementById('yearMonth').value;

        if (!yearMonth) {
            alert("월을 선택해주세요.");
            return;
        }

        const types = ['keyword', 'category', 'activate'];

        for (const type of types) {
            const params = new URLSearchParams();
            params.append('type', type);
            params.append('yearMonth', yearMonth);
            if (ageGroup) params.append('ageGroup', ageGroup);
            if (gender) params.append('gender', gender);

            try {
                const res = await fetch(`${BASE_URL}/admin/admin/summary?${params.toString()}`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!res.ok) {
                    const errorText = await res.text();
                    console.error(`❌ API 요청 실패 [${type}]:`, res.status, errorText);
                    alert(`요약 데이터 조회 실패 (${type}): ${res.status}`);
                    continue;
                }

                const result = await res.json();
                renderSummary(type, result, `chart${capitalize(type)}`, `table${capitalize(type)}`, type === 'activate' ? 'line' : 'bar');
            } catch (err) {
                console.error(`🚨 요청 중 예외 발생 [${type}]:`, err);
                alert(`데이터 요청 오류 (${type})`);
            }
        }
    });

    function renderSummary(type, data, canvasId, tableId, chartType) {
        let labels, counts;

        if (type === 'activate') {
            const sorted = data.map(d => ({ ...d, hour: parseInt(d.keyword) }))
                .sort((a, b) => a.hour - b.hour);
            labels = sorted.map(d => `${d.hour}시`);
            counts = sorted.map(d => d.count);
            data = sorted;
        } else {
            labels = data.map(d => d.keyword);
            counts = data.map(d => d.count);
        }

        const ctx = document.getElementById(canvasId).getContext('2d');
        if (chartInstances[canvasId]) {
            chartInstances[canvasId].destroy();
        }

        chartInstances[canvasId] = new Chart(ctx, {
            type: chartType,
            data: {
                labels: labels,
                datasets: [{
                    label: `${type} 수`,
                    data: counts,
                    backgroundColor: 'rgba(102, 126, 234, 0.6)',
                    borderColor: 'rgba(102, 126, 234, 1)',
                    fill: chartType !== 'line'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });

        const tbody = document.getElementById(tableId);
        tbody.innerHTML = data.map(d => `
            <tr>
                <td>${type === 'activate' ? `${d.keyword}시` : d.keyword}</td>
                <td>${d.count}</td>
                <td>${d.distinctUserCount}</td>
            </tr>
        `).join('');
    }

    function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function handleLogout() {
        alert('로그아웃 처리 예정');
    }
</script>
</body>
</html>
