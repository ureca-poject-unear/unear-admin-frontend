<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>요약 대시보드</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/main.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .main-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: space-between;
        }
        .main-grid.three-column .dashboard-card {
            flex: 1 1 calc(33.333% - 24px);
            max-width: calc(33.333% - 24px);
        }
        .main-grid.two-column .dashboard-card {
            flex: 1 1 calc(50% - 24px);
            max-width: calc(50% - 24px);
        }
        .dashboard-card {
            min-width: 300px;
            padding: 16px;
            border-radius: 16px;
            background-color: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            height: 680px;
            display: flex;
            flex-direction: column;
        }
        .card-title { font-size: 20px; margin-bottom: 4px; }
        .card-description { font-size: 13px; margin-bottom: 8px; }
        .chart-wrapper { height: 500px; }
        .filter-form, .dashboard-toggle {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
            align-items: flex-end;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            min-width: 120px;
        }
        .form-group select, .form-group input[type="month"] {
            padding: 8px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        .submit-button {
            padding: 9px 16px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .submit-button:hover { background-color: #5a67d8; }
        body { overflow-x: hidden; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-left"><h1>UNEAR ADMIN</h1><div class="welcome-message">환영합니다, 관리자님!</div></div>
        <div class="header-right"><div class="user-info"><div class="user-avatar">관</div><span>관리자</span></div>
            <button class="logout-btn" onclick="handleLogout()">로그아웃</button></div>
    </div>

    <div class="dashboard-toggle">
        <button onclick="showSection('summary')" class="submit-button">요약 대시보드</button>
        <button onclick="showSection('event')" class="submit-button">이벤트 통계</button>
    </div>

    <form id="filter-form" class="filter-form">
        <div class="form-group">
            <label for="ageGroup">연령대</label>
            <select id="ageGroup">
                <option value="">전체</option><option value="10s">10대</option>
                <option value="20s">20대</option><option value="30s">30대</option>
                <option value="40s">40대</option>
            </select>
        </div>
        <div class="form-group">
            <label for="gender">성별</label>
            <select id="gender">
                <option value="">전체</option><option value="M">남성</option><option value="F">여성</option>
            </select>
        </div>
        <div class="form-group">
            <label for="yearMonth">월 선택</label>
            <input type="month" id="yearMonth" required />
        </div>
        <div class="form-group">
            <label>&nbsp;</label>
            <button type="submit" class="submit-button">조회</button>
        </div>
    </form>

    <div id="summary-section" class="main-grid three-column">
        <div class="card dashboard-card">
            <div class="card-title">인기 검색어</div>
            <div class="card-description">최근 인기 키워드를 확인하세요</div>
            <div class="chart-wrapper"><canvas id="chartKeyword"></canvas></div>
        </div>
        <div class="card dashboard-card">
            <div class="card-title">관심 카테고리</div>
            <div class="card-description">사용자의 관심 카테고리를 분석합니다</div>
            <div class="chart-wrapper"><canvas id="chartCategory"></canvas></div>
        </div>
        <div class="card dashboard-card">
            <div class="card-title">시간대별 활성도</div>
            <div class="card-description">활동 시간대를 확인하세요</div>
            <div class="chart-wrapper"><canvas id="chartActivate"></canvas></div>
        </div>
    </div>

    <div id="event-section" class="main-grid two-column" style="display:none;">
        <div class="card dashboard-card">
            <div class="card-title">인기 이벤트 매장 순위</div>
            <div class="chart-wrapper"><canvas id="eventChart"></canvas></div>
        </div>
        <div class="card dashboard-card">
            <div class="card-title">이벤트 완료율/이탈율</div>
            <div class="chart-wrapper"><canvas id="completionChart"></canvas></div>
        </div>
    </div>
</div>

<script>
    const BASE_URL = "https://dev.unear.site/api";
    const form = document.getElementById('filter-form');
    const chartInstances = {};
    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('yearMonth').value = new Date().toISOString().slice(0, 7);
        form.dispatchEvent(new Event('submit'));
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const ageGroup = document.getElementById('ageGroup').value;
        const gender = document.getElementById('gender').value;
        const yearMonth = document.getElementById('yearMonth').value;

        const types = ['keyword', 'category', 'activate'];
        for (const type of types) {
            const params = new URLSearchParams({ type, yearMonth });
            if (ageGroup) params.append('ageGroup', ageGroup);
            if (gender) params.append('gender', gender);

            const res = await fetch(`${BASE_URL}/admin/admin/summary?${params.toString()}`);
            const result = await res.json();
            renderSummary(type, result, `chart${capitalize(type)}`, type === 'activate' ? 'line' : 'bar');
        }
    });

    function renderSummary(type, data, canvasId, chartType) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        if (chartInstances[canvasId]) chartInstances[canvasId].destroy();
        let labels, counts;

        if (type === 'activate') {
            const sorted = data.filter(d => d.keyword >= 6 && d.keyword <= 23).sort((a, b) => a.keyword - b.keyword);
            labels = sorted.map(d => `${d.keyword}시`);
            counts = sorted.map(d => d.count);
        } else {
            const top10 = data.sort((a, b) => b.count - a.count).slice(0, 10);
            labels = top10.map(d => d.keyword);
            counts = top10.map(d => d.count);
        }

        chartInstances[canvasId] = new Chart(ctx, {
            type: chartType,
            data: {
                labels: labels,
                datasets: [{
                    label: `${type} 수`,
                    data: counts,
                    backgroundColor: 'rgba(102, 126, 234, 0.6)',
                    borderColor: 'rgba(102, 126, 234, 1)',
                    borderWidth: 1,
                    fill: chartType !== 'line',
                    tension: 0.4,
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                scales: { x: { ticks: { autoSkip: false } }, y: { beginAtZero: true } }
            }
        });
    }

    function showSection(section) {
        const summary = document.getElementById('summary-section');
        const event = document.getElementById('event-section');

        if (section === 'summary') {
            summary.style.display = 'flex';
            summary.classList.add('three-column');
            event.style.display = 'none';
            event.classList.remove('two-column');
        } else {
            summary.style.display = 'none';
            summary.classList.remove('three-column');
            event.style.display = 'flex';
            event.classList.add('two-column');
            loadEventStats();
        }
    }


    async function loadEventStats() {
        const yearMonth = document.getElementById('yearMonth').value;
        const ageGroup = document.getElementById('ageGroup').value;
        const gender = document.getElementById('gender').value;
        const params = new URLSearchParams({ yearMonth });
        if (ageGroup) params.append('ageGroup', ageGroup);
        if (gender) params.append('gender', gender);

        const res1 = await fetch(`${BASE_URL}/admin/admin/summary/event-place?yearMonth=${yearMonth}`);
        const data1 = await res1.json();
        const sorted = data1.sort((a, b) => b.count - a.count);
        const labels = sorted.map(d => d.keyword);
        const counts = sorted.map(d => d.count);
        const ctx1 = document.getElementById('eventChart').getContext('2d');
        if (chartInstances['eventChart']) chartInstances['eventChart'].destroy();
        chartInstances['eventChart'] = new Chart(ctx1, {
            type: 'bar',
            data: { labels, datasets: [{ label: '방문 수', data: counts, backgroundColor: 'rgba(255,99,132,0.6)' }] },
            options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });

        const res2 = await fetch(`${BASE_URL}/admin/admin/summary/event-stats?${params}`);
        const data2 = await res2.json();
        console.log('✅ 이벤트 통계 데이터:', data2);  // ← 디버깅용
        const group = data2[0];
        const totalJoin = group.joinCount || 0;
        const totalDone = group.doneCount || 0;
        const totalDrop = group.dropCount || 0;
        const doneRate = +(group.completionRate * 100).toFixed(1); // ← 소수점 퍼센트
        const dropRate = +(group.dropRate * 100).toFixed(1);


        const ctx2 = document.getElementById('completionChart').getContext('2d');
        if (chartInstances['completionChart']) chartInstances['completionChart'].destroy();

        chartInstances['completionChart'] = new Chart(ctx2, {
            type: 'bar',
            data: {
                labels: ["참여자 수", "완료자 수", "이탈자 수", "완료율 (%)", "이탈율 (%)"],
                datasets: [{
                    label: '이벤트 통계',
                    data: [totalJoin, totalDone, totalDrop, doneRate, dropRate], // ✅ 숫자만
                    backgroundColor: ['#36A2EB', '#4BC0C0', '#FF6384', '#9966FF', '#FF9F40']
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        suggestedMax: 100, // 비율 대비 y축 예쁘게
                        ticks: {
                            callback: value => value + '%'
                        }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });

        document.getElementById('statsTableBody').innerHTML = data2.map(d => `
        <tr>
            <td>${d.group || '전체'}</td>
            <td>${d.joinCount}</td>
            <td>${d.doneCount}</td>
            <td>${d.dropCount}</td>
            <td>${(d.completionRate * 100).toFixed(1)}%</td>
            <td>${(d.dropRate * 100).toFixed(1)}%</td>
        </tr>
    `).join('');

    }
    function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }
    function handleLogout() { alert('로그아웃 처리 예정'); }
</script>
</body>
</html>
