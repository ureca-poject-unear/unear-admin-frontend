<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>요약 대시보드</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/main.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        .main-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: space-between;
        }

        .dashboard-card {
            flex: 1 1 calc(33.333% - 24px);
            min-width: 300px;
            max-width: calc(33.333% - 24px);
            padding: 16px; /* 기존: 24px → 줄임 */
            border-radius: 16px;
            background-color: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            height: 680px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* 상단 텍스트 영역 여백 줄이기 */
        .card-title {
            font-size: 20px;  /* 기존보다 작게 */
            margin-bottom: 4px;
        }
        .card-description {
            font-size: 13px;  /* 기존보다 작게 */
            margin-bottom: 8px;
        }

        /* 그래프 wrapper 높이 조정 */
        .chart-wrapper {
            height: 500px;  /* 기존보다 살짝 줄임 */
        }


        @media (max-width: 1024px) {
            .dashboard-card {
                flex: 1 1 100%;
                max-width: 100%;
            }
        }

        .filter-form {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 120px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }

        .form-group select,
        .form-group input[type="month"] {
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #fff;
            min-width: 120px;
        }

        .submit-button {
            padding: 9px 16px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }

        .submit-button:hover {
            background-color: #5a67d8;
        }

        @media (max-width: 600px) {
            .filter-form {
                flex-direction: column;
                align-items: stretch;
            }
            .form-group {
                width: 100%;
            }
        }


        body {
            overflow-x: hidden;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-left">
            <h1>UNEAR ADMIN</h1>
            <div class="welcome-message">환영합니다, 관리자님!</div>
        </div>
        <div class="header-right">
            <div class="user-info">
                <div class="user-avatar">관</div>
                <span>관리자</span>
            </div>
            <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        </div>
    </div>

    <form id="filter-form" class="filter-form">
        <div class="form-group">
            <label for="ageGroup">연령대</label>
            <select id="ageGroup">
                <option value="">전체</option>
                <option value="10s">10대</option>
                <option value="20s">20대</option>
                <option value="30s">30대</option>
                <option value="40s">40대</option>
            </select>
        </div>

        <div class="form-group">
            <label for="gender">성별</label>
            <select id="gender">
                <option value="">전체</option>
                <option value="M">남성</option>
                <option value="F">여성</option>
            </select>
        </div>

        <div class="form-group">
            <label for="yearMonth">월 선택</label>
            <input type="month" id="yearMonth" required />
        </div>

        <div class="form-group">
            <label>&nbsp;</label>
            <button type="submit" class="submit-button">조회</button>
        </div>
    </form>


    <div class="main-grid">
        <!-- 인기 검색어 -->
        <div class="card dashboard-card">
            <div class="card-title">인기 검색어</div>
            <div class="card-description">최근 인기 키워드를 확인하세요</div>
            <div class="chart-wrapper">
                <canvas id="chartKeyword" style="height: 300px;"></canvas>
            </div>
        </div>

        <!-- 관심 카테고리 -->
        <div class="card dashboard-card">
            <div class="card-title">관심 카테고리</div>
            <div class="card-description">사용자의 관심 카테고리를 분석합니다</div>
            <div class="chart-wrapper">
                <canvas id="chartCategory" style="height: 300px;"></canvas>
            </div>
        </div>

        <!-- 시간대별 활성도 -->
        <div class="card dashboard-card">
            <div class="card-title">시간대별 활성도</div>
            <div class="card-description">어느 시간대에 활동이 가장 많은지 확인하세요</div>
            <div class="chart-wrapper">
                <canvas id="chartActivate" style="height: 300px;"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const BASE_URL = "https://dev.unear.site/api";
    const form = document.getElementById('filter-form');
    const chartInstances = {};

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const ageGroup = document.getElementById('ageGroup').value;
        const gender = document.getElementById('gender').value;
        const yearMonth = document.getElementById('yearMonth').value;

        if (!yearMonth) {
            alert("월을 선택해주세요.");
            return;
        }

        const types = ['keyword', 'category', 'activate'];

        for (const type of types) {
            const params = new URLSearchParams();
            params.append('type', type);
            params.append('yearMonth', yearMonth);
            if (ageGroup) params.append('ageGroup', ageGroup);
            if (gender) params.append('gender', gender);

            try {
                const res = await fetch(`${BASE_URL}/admin/admin/summary?${params.toString()}`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!res.ok) {
                    const errorText = await res.text();
                    console.error(`❌ API 요청 실패 [${type}]:`, res.status, errorText);
                    alert(`요약 데이터 조회 실패 (${type}): ${res.status}`);
                    continue;
                }

                const result = await res.json();
                renderSummary(type, result, `chart${capitalize(type)}`, type === 'activate' ? 'line' : 'bar');
            } catch (err) {
                console.error(`🚨 요청 중 예외 발생 [${type}]:`, err);
                alert(`데이터 요청 오류 (${type})`);
            }
        }
    });

    function renderSummary(type, data, canvasId, chartType) {
        let labels, counts;

        if (type === 'activate') {
            const sorted = data
                .map(d => ({ ...d, hour: parseInt(d.keyword) }))
                .filter(d => d.hour >= 6 && d.hour <= 23)
                .sort((a, b) => a.hour - b.hour);

            labels = sorted.map(d => `${d.hour}시`);
            counts = sorted.map(d => d.count);
        } else {
            const top10 = data
                .sort((a, b) => b.count - a.count)
                .slice(0, 10);
            labels = top10.map(d => d.keyword);
            counts = top10.map(d => d.count);
        }

        const ctx = document.getElementById(canvasId).getContext('2d');
        if (chartInstances[canvasId]) {
            chartInstances[canvasId].destroy();
        }

        chartInstances[canvasId] = new Chart(ctx, {
            type: chartType,
            data: {
                labels: labels,
                datasets: [{
                    label: `${type} 수`,
                    data: counts,
                    backgroundColor: 'rgba(102, 126, 234, 0.6)',
                    borderColor: 'rgba(102, 126, 234, 1)',
                    borderWidth: 1,
                    fill: chartType !== 'line',
                    tension: 0.4,
                    pointRadius: 4
                }]
            },
            options: {
                maintainAspectRatio: false,
                responsive: true,
                scales: {
                    x: {
                        ticks: {
                            autoSkip: false,     // ✅ label 생략 비활성화
                            maxRotation: 0,
                            minRotation: 0,
                            font: { size: 12 }
                        }
                    },
                    y: {
                        beginAtZero: true
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        labels: {
                            font: { size: 13 }
                        }
                    }
                }
            }
        });
    }



    function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function handleLogout() {
        alert('로그아웃 처리 예정');
    }
</script>
</body>
</html>
