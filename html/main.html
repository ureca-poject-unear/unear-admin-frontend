<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>UNEAR ADMIN - 메인</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f8f9fa;
            padding: 2rem;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <h1 id="welcomeMessage">환영합니다!</h1>
    <p>이곳은 UNEAR 관리자 메인 페이지입니다.</p>

    <script src="../js/config.js"></script>
    <script>
        const admin = SessionManager.get();
        if (admin && admin.name) {
            document.getElementById('welcomeMessage').textContent =
                `환영합니다, ${admin.name}님!`;
        } else {
            // 세션 정보 없으면 로그인 페이지로 리다이렉트
            alert("로그인이 필요합니다.");
            window.location.href = "../index.html";
        }
    </script>
</body>
</html>
